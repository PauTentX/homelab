# ==============================================================================
# Configuration LXC Proxmox VE : 132-gitea.conf (Exemple Forge & CI/CD)
# ==============================================================================
# Rôle : Hébergement de la forge logicielle locale Gitea et registre Git.
#
# Explications des paramètres clés :
# - arch : Architecture CPU cible (amd64).
# - cores : 1 vCPU alloué, suffisant pour un usage forge/git interne réactif.
# - memory : 1024 Mo de RAM (Gitea écrit en Go est très économe).
# - swap : 512 Mo de swap pour absorber les pics éventuels lors des pushes volumineux.
# - ostype : Distribution Linux de base du conteneur (Debian 12).
# - rootfs : Volume de stockage racine LVM-thin de 8 Go.
# - unprivileged: 1 : Conteneur non privilégié pour isoler strictement root de l'hôte
#   (UID/GID mapping), respectant le principe de moindre privilège.
# - features: keyctl=1,nesting=1,fuse=1 :
#     * keyctl : nécessaire pour la gestion de session / keyring dans certains sous-systèmes.
#     * nesting : permet l'imbrication si des sous-conteneurs sont créés.
#     * fuse : support du montage de systèmes de fichiers FUSE en espace utilisateur.
# - net0 : Interface réseau virtuelle veth rattachée au pont vmbr0 (LAN principal).
#   * hwaddr : Adresse MAC générique/anonymisée.
#   * ip : Attribution par DHCP ou réservation IP statique LAN.
# - onboot: 1 : Démarrage automatique au boot de l'hyperviseur Proxmox.
# - lxc.mount.entry & lxc.cgroup2.devices.allow : autorise l'accès au périphérique TUN
#   si une connectivité VPN/tunneling est requise.
# ==============================================================================

arch: amd64
cores: 1
features: keyctl=1,nesting=1,fuse=1
hostname: gitea
memory: 1024
net0: name=eth0,bridge=vmbr0,hwaddr=XX:XX:XX:XX:XX:XX,ip=<IP>/24,gw=<GATEWAY>,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-132-disk-0,size=8G
swap: 512
tags: git;forge;self-hosted
unprivileged: 1
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,create=file

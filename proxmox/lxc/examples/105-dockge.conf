# ==============================================================================
# Configuration LXC Proxmox VE : 105-dockge.conf (Exemple Hôte Docker & Volumes)
# ==============================================================================
# Rôle : Hôte Docker multi-conteneurs (Dockge) hébergeant les stacks d'infrastructure,
# gestionnaire de conteneurs applicatifs et points de montage NAS/périphériques.
#
# Explications des paramètres clés :
# - arch : Architecture CPU cible (amd64).
# - cores : 16 vCPUs partagés pour exécuter en parallèle de multiples stacks applicatives.
# - memory : 32768 Mo (32 Go RAM) pour absorber la charge combinée des micro-services.
# - swap : 4096 Mo de swap.
# - ostype : Debian 12 (noyau stable, excellente compatibilité avec le daemon Docker).
# - rootfs : Volume local LVM-thin de 150 Go hébergeant les images et layers Docker locaux.
# - mp0 : Point de montage bind mount (`/mnt/nas-storage/` vers `/data/` dans le conteneur)
#   permettant d'accéder aux données partagées sans dupliquer l'espace disque.
# - features: nesting=1 : Obligatoire pour faire tourner le daemon Docker à l'intérieur
#   du conteneur LXC (imbrication de namespaces cgroups/overlayfs).
# - lxc.mount.entry & lxc.cgroup2.devices.allow : Passthrough de périphériques USB/Série
#   (par ex. dongles domotiques Zigbee/Z-Wave, adaptateurs série) mappés dans le conteneur.
# ==============================================================================

arch: amd64
cores: 16
features: nesting=1
hostname: dockge
memory: 32768
mp0: /mnt/nas-storage/,mp=/data/
net0: name=eth0,bridge=vmbr0,hwaddr=XX:XX:XX:XX:XX:XX,ip=<IP>/24,gw=<GATEWAY>,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-105-disk-0,size=150G
swap: 4096
tags: docker;compose;stacks
lxc.cgroup2.devices.allow: a
lxc.cap.drop:
lxc.cgroup2.devices.allow: c 188:* rwm
lxc.cgroup2.devices.allow: c 189:* rwm
lxc.mount.entry: /dev/serial/by-id  dev/serial/by-id  none bind,optional,create=dir
lxc.mount.entry: /dev/ttyUSB0       dev/ttyUSB0       none bind,optional,create=file
lxc.mount.entry: /dev/ttyUSB1       dev/ttyUSB1       none bind,optional,create=file
lxc.mount.entry: /dev/ttyACM0       dev/ttyACM0       none bind,optional,create=file
lxc.mount.entry: /dev/ttyACM1       dev/ttyACM1       none bind,optional,create=file

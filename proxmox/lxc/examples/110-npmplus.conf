# ==============================================================================
# Configuration LXC Proxmox VE : 110-npmplus.conf (Exemple Reverse Proxy)
# ==============================================================================
# Rôle : Reverse proxy central (NPMplus / Nginx Proxy Manager Plus) gérant la
# terminaison TLS, HSTS, certificats Let's Encrypt et le routage HTTP(S).
#
# Explications des paramètres clés :
# - arch : Architecture CPU cible (amd64).
# - cores : 4 vCPUs alloués pour encaisser le débit réseau chiffré et le SSL handshake
#   sans goulot d'étranglement.
# - memory : 2048 Mo de RAM (moteur Nginx ultra-léger et cache SSL/FastCGI).
# - swap : 512 Mo de swap de débordement.
# - ostype : Alpine Linux pour une surface d'attaque minimale et un démarrage instantané.
# - rootfs : Volume LVM-thin de 10 Go (suffisant pour OS, certificats et logs Nginx).
# - unprivileged: 1 : Conteneur non privilégié pour sécuriser le frontal réseau ;
#   même en cas de compromission Nginx, l'attaquant reste confiné dans un UID non-root hôte.
# - features: keyctl=1,nesting=1 : nesting requis pour certaines piles internes et
#   gestion de l'isolation.
# - net0 : Interface réseau reliée au pont local vmbr0 pour distribuer le trafic
#   vers les LXC et stacks Docker internes.
# - onboot: 1 : Service critique lancé immédiatement au démarrage de la machine physique.
# ==============================================================================

arch: amd64
cores: 4
features: keyctl=1,nesting=1
hostname: npmplus
memory: 2048
net0: name=eth0,bridge=vmbr0,hwaddr=XX:XX:XX:XX:XX:XX,ip=<IP>/24,gw=<GATEWAY>,type=veth
onboot: 1
ostype: alpine
rootfs: local-lvm:vm-110-disk-0,size=10G
swap: 512
tags: nginx;reverse-proxy;security
unprivileged: 1

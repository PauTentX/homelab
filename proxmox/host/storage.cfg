# Proxmox VE Storage Configuration (Exemple Assaini)
# Hôte : Hyperviseur Proxmox VE (EVA-002)

# Stockage local par défaut (ISOs, modèles VZ, sauvegardes)
dir: local
	path /var/lib/vz
	content backup,iso,vztmpl

# Volume LVM-Thin local pour les disques virtuels LXC et VM (alloué dynamiquement)
lvmthin: local-lvm
	thinpool data
	vgname pve
	content rootdir,images

# Partage réseau CIFS/SMB distant (NAS TrueNAS / stockage partagé)
cifs: nas-storage
	path /mnt/pve/nas-storage
	server <NAS_IP>
	share <SHARE_NAME>
	content import
	prune-backups keep-all=1
	username <USERNAME>

# Disque de sauvegarde dédié local
dir: backup-storage
	path /mnt/backup
	content vztmpl,iso,backup

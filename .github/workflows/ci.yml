name: Lint & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Markdown Lint & ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
        continue-on-error: true

      - name: ShellCheck Scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            find scripts/ -name "*.sh" -exec shellcheck {} + 2>/dev/null || true
          else
            echo "ShellCheck check completed (placeholder)"
          fi

  secret-detection:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (binaire officiel)
        run: |
          V=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact -v --no-banner

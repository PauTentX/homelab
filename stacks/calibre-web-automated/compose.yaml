services:
  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
    volumes:
      - /config/calibre-auto/:/config
      - /data/importlivre/:/cwa-book-ingest
      - /data/Livre/:/calibre-library
    ports:
      - "8083:8083"
    restart: unless-stopped
networks: {}

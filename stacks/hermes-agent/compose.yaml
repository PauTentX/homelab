services:
  hermes-agent:
    image: nousresearch/hermes-agent@sha256:3e9fe4c6ef36490f43aa0d0d80f9df64e9c92a576eee3042f1a97c8813c05355
    container_name: hermes-agent
    restart: unless-stopped
    ports:
      - "8642:8642"
    env_file:
      - .env
    environment:
      - TZ=Europe/Paris
      - HERMES_HOME=/opt/data
      - PYTHONUNBUFFERED=1
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=8642
    volumes:
      - ./data:/opt/data
      - ~/.ssh:/root/.ssh:ro

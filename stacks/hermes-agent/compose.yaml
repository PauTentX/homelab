services:
  aiclient2api:
    image: justlikemaki/aiclient-2-api:latest
    container_name: aiclient2api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8086:8086"
    volumes:
      - ./aiclient-configs:/app/configs
    environment:
      - TZ=Europe/Paris

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-agent
    restart: unless-stopped
    depends_on:
      - aiclient2api
    ports:
      - "8642:8642"
      - "8643:8643"
      - "8644:8644"
    stdin_open: true
    tty: true
    env_file:
      - .env.dashboard
      - .env.secrets
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - HERMES_HOME=/opt/data
      - PYTHONUNBUFFERED=1
      - OPENAI_BASE_URL=http://aiclient2api:3000/gemini-antigravity/v1
      - HERMES_DASHBOARD=true
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=8642
      - SEARXNG_URL=http://eva-002.lan:8080
    volumes:
      - ./data:/opt/data
      - ~/.ssh:/root/.ssh:ro
networks: {}

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'smart-proxmox'
    static_configs:
      - targets: ['eva-002.lan:9188']

  - job_name: 'zfs-truenas'
    static_configs:
      - targets: ['truenas.lan:9156']

  - job_name: 'smart-homelab'
    static_configs:
      - targets: ['smart-exporter:9199']

  - job_name: 'freebox-delta'
    static_configs:
      - targets: ['freebox-exporter:9105']

  - job_name: 'proxmox-ve'
    static_configs:
      - targets: ['eva-002.lan:9221']

  - job_name: 'node-exporter-proxmox'
    static_configs:
      - targets: ['eva-002.lan:9100']

  - job_name: 'node-exporter-truenas'
    static_configs:
      - targets: ['truenas.lan:9100']

  - job_name: 'blackbox-network'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
        - freebox.lan    # Freebox Gateway
        - eva-002.lan     # EVA-002 (Proxmox VE)
        - truenas.lan     # EVA-001 (TrueNAS Scale)
        - npmplus.lan    # NPM Plus (LXC 110)
        - dockge.lan    # Dockge / n8n / AI (LXC 105)
        - gitea.lan     # Gitea (LXC 132)
        - watchyourlan.lan    # WatchYourLAN (LXC 129)
        - astro.lan     # Astro Website (LXC 136)
        - 1.1.1.1          # Cloudflare DNS (WAN)
        - 8.8.8.8          # Google DNS (WAN)
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://dockge.lan:5678/healthz     # n8n
        - http://gitea.lan:3000/api/v1/version # Gitea
        - http://astro.lan:8080               # Astro Website
        - https://laurenttailliez.dev            # Site public WAN
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: 'nut-ups'
    metrics_path: /ups_metrics
    params:
      ups: [eaton]
    static_configs:
      - targets: ['nut-exporter:9199']

  - job_name: "hermes-tokens"
    scrape_interval: 30s
    static_configs:
      - targets: ["dockge.lan:9180"]
